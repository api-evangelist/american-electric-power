apis:
  - aid: american-electric-power-api-management
    name: AEP API Management
    description: >-
      American Electric Power operates an Azure API Management instance
      (apim-aep-prod-use2-001) fronted by the "AEP API Management" developer portal at
      developer.aep.com and the gateway host api.aep.com. The portal is public and the
      gateway is live, but the anonymous catalog is empty: GET
      /developer/apis?api-version=2022-04-01-preview returns {"value":[],"nextLink":null},
      and so does the products listing. Every API, operation and specification is visible
      only after a developer-portal account is created and approved, so no machine-readable
      contract could be captured.
    humanURL: https://developer.aep.com/apis
    baseURL: https://api.aep.com
    tags:
      - API Management
      - Energy
      - Electric Utility
    properties:
      - type: DeveloperPortal
        url: https://developer.aep.com/
      - type: SignUp
        url: https://developer.aep.com/signup
      - type: Plans
        url: plans/american-electric-power-plans-pricing.yml
      - type: RateLimits
        url: rate-limits/american-electric-power-rate-limits.yml
    x-discovery:
      portal_software: Azure API Management developer portal
      apim_instance: apim-aep-prod-use2-001
      config: https://developer.aep.com/config.json
      anonymous_api_count: 0
      anonymous_product_count: 0
      gateway_probe:
